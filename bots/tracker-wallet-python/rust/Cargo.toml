[package]
name = "polymarket-tracker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "polymarket-tracker"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Discord — poise re-exports serenity 0.12, não precisa declarar serenity separadamente
poise = "0.6"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# MongoDB
mongodb = { version = "3" }

# Serialização
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Datas e timestamps
chrono = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Variáveis de ambiente
dotenvy = "0.15"

# Streams assíncronos (necessário para cursor do MongoDB)
futures = "0.3"
